# Configuration for Obstacle Detection
obstacle_detection:
  hsv:
    # Mars terrain is generally orange/red, so dark rocks will have lower value/saturation
    # We will look for dark colored regions or non-orange regions as obstacles
    # Dark obstacle bounds (e.g. shadows and rocks)
    lower_bound: [0, 0, 0]
    upper_bound: [180, 255, 80] # High value in Value channel means bright. We want dark things.
  
  contours:
    min_area: 100 # Minimum pixel area to be considered an obstacle
